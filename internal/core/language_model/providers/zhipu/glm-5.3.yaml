model: glm-5.3
label: GLM-5.3
model_type: chat
features:
  - tool_call
  - agent_thought
# 上下文/输出长度为保守值，若与官网最新文档不符可直接修改这两项
context_window: 200000
max_output_tokens: 8192
attributes:
  model: glm-5.3
metadata:
  pricing:
    input: 0.0005
    output: 0.0015
    unit: 0.001
    currency: RMB
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_completion_tokens
    default: 4096
    max: 8192
